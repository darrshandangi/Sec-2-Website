<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650" width="100%" height="100%">
  <defs>
    <!-- Background glow filter -->
    <filter id="glow-forest-green" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="40" result="blur" />
    </filter>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="24" stdDeviation="25" flood-color="#000000" flood-opacity="0.8" />
    </filter>
    <filter id="soft-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="15" flood-color="#000000" flood-opacity="0.6" />
    </filter>

    <!-- Metallic Accents Gradient -->
    <linearGradient id="metal-accent-forest-green" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ECC765" />
      <stop offset="35%" stop-color="#B8860B" />
      <stop offset="50%" stop-color="#ECC765" />
      <stop offset="75%" stop-color="#B8860B" />
      <stop offset="100%" stop-color="#ECC765" />
    </linearGradient>

    <!-- Chassis Body Gradient -->
    <linearGradient id="chassis-grad-forest-green" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#23452D" />
      <stop offset="30%" stop-color="#172E1E" />
      <stop offset="100%" stop-color="#0E1A11" />
    </linearGradient>

    <!-- Speaker Cone Radial Gradient -->
    <radialGradient id="cone-grad" cx="45%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#2a2a2e" />
      <stop offset="40%" stop-color="#141416" />
      <stop offset="70%" stop-color="#0a0a0c" />
      <stop offset="90%" stop-color="#B8860B" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#050505" />
    </radialGradient>

    <!-- Center Dust Cap Gradient -->
    <radialGradient id="cap-grad-forest-green" cx="40%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#ECC765" />
      <stop offset="45%" stop-color="#B8860B" />
      <stop offset="100%" stop-color="#111111" />
    </radialGradient>

    <!-- Acoustic Grille Pattern -->
    <pattern id="mesh-pattern-forest-green" width="10" height="10" patternUnits="userSpaceOnUse">
      <circle cx="5" cy="5" r="1.5" fill="#DAA520" fill-opacity="0.35" />
    </pattern>
  </defs>

  <!-- Ambient Underglow -->
  <ellipse cx="500" cy="380" rx="420" ry="160" fill="#B8860B" fill-opacity="0.18" filter="url(#glow-forest-green)" />
  
  <!-- Ground Contact Shadow -->
  <ellipse cx="500" cy="540" rx="380" ry="35" fill="#000000" fill-opacity="0.85" filter="url(#glow-forest-green)" />

  <!-- MAIN SPEAKER BODY GROUP (Dual Panel) -->
  <g filter="url(#shadow)">
    
    <!-- LEFT PANEL CHASSIS -->
    <g transform="translate(140, 110)">
      <!-- Outer Metal Bevel -->
      <rect x="0" y="0" width="330" height="400" rx="28" fill="url(#metal-accent-forest-green)" />
      <!-- Inner Matte Chassis -->
      <rect x="4" y="4" width="322" height="392" rx="24" fill="url(#chassis-grad-forest-green)" />
      
      <!-- Top Specular Bevel Line -->
      <line x1="28" y1="4" x2="302" y2="4" stroke="#ffffff" stroke-width="1.5" stroke-opacity="0.4" />

      <!-- Acoustic Driver Outer Ring -->
      <circle cx="165" cy="190" r="115" fill="#0c0c0e" stroke="url(#metal-accent-forest-green)" stroke-width="2.5" />
      
      <!-- Micro-Drilled Grille Mesh Layer -->
      <circle cx="165" cy="190" r="112" fill="url(#mesh-pattern-forest-green)" />

      <!-- Speaker Cone -->
      <circle cx="165" cy="190" r="85" fill="url(#cone-grad)" stroke="#1a1a1a" stroke-width="1" />
      <!-- Ribbed Suspension Surround Rings -->
      <circle cx="165" cy="190" r="95" fill="none" stroke="#B8860B" stroke-width="1" stroke-opacity="0.3" />
      <circle cx="165" cy="190" r="75" fill="none" stroke="#222" stroke-width="1.5" />
      <circle cx="165" cy="190" r="60" fill="none" stroke="#161616" stroke-width="1" />
      
      <!-- Center Spun Copper/Gold Dust Cap -->
      <circle cx="165" cy="190" r="32" fill="url(#cap-grad-forest-green)" stroke="#ECC765" stroke-width="1" />
      <!-- Specular Gleam on Cap -->
      <ellipse cx="157" cy="182" rx="12" ry="7" fill="#ffffff" fill-opacity="0.45" />

      <!-- Subtle Branding on Left Panel -->
      <text x="165" y="345" font-family="'Inter', sans-serif" font-size="11" font-weight="700" letter-spacing="3" fill="#ECC765" fill-opacity="0.8" text-anchor="middle">FOLDBEAT ACOUSTICS</text>
      <text x="165" y="362" font-family="'Inter', sans-serif" font-size="8" font-weight="500" letter-spacing="2" fill="#888888" text-anchor="middle">45MM NEODYMIUM DRIVER</text>
    </g>

    <!-- RIGHT PANEL CHASSIS -->
    <g transform="translate(530, 110)">
      <!-- Outer Metal Bevel -->
      <rect x="0" y="0" width="330" height="400" rx="28" fill="url(#metal-accent-forest-green)" />
      <!-- Inner Matte Chassis -->
      <rect x="4" y="4" width="322" height="392" rx="24" fill="url(#chassis-grad-forest-green)" />
      
      <!-- Top Specular Bevel Line -->
      <line x1="28" y1="4" x2="302" y2="4" stroke="#ffffff" stroke-width="1.5" stroke-opacity="0.4" />

      <!-- Acoustic Driver Outer Ring -->
      <circle cx="165" cy="190" r="115" fill="#0c0c0e" stroke="url(#metal-accent-forest-green)" stroke-width="2.5" />
      
      <!-- Micro-Drilled Grille Mesh Layer -->
      <circle cx="165" cy="190" r="112" fill="url(#mesh-pattern-forest-green)" />

      <!-- Speaker Cone -->
      <circle cx="165" cy="190" r="85" fill="url(#cone-grad)" stroke="#1a1a1a" stroke-width="1" />
      <circle cx="165" cy="190" r="95" fill="none" stroke="#B8860B" stroke-width="1" stroke-opacity="0.3" />
      <circle cx="165" cy="190" r="75" fill="none" stroke="#222" stroke-width="1.5" />
      <circle cx="165" cy="190" r="60" fill="none" stroke="#161616" stroke-width="1" />
      
      <!-- Center Spun Dust Cap -->
      <circle cx="165" cy="190" r="32" fill="url(#cap-grad-forest-green)" stroke="#ECC765" stroke-width="1" />
      <ellipse cx="157" cy="182" rx="12" ry="7" fill="#ffffff" fill-opacity="0.45" />

      <!-- Minimal Controls on Right Panel -->
      <circle cx="95" cy="350" r="12" fill="#18181c" stroke="#B8860B" stroke-width="1" />
      <text x="95" y="354" font-family="'Inter', sans-serif" font-size="12" font-weight="600" fill="#ECC765" text-anchor="middle">-</text>

      <circle cx="165" cy="350" r="15" fill="#18181c" stroke="#ECC765" stroke-width="1.5" />
      <!-- Play icon -->
      <polygon points="162,344 171,350 162,356" fill="#ECC765" />

      <circle cx="235" cy="350" r="12" fill="#18181c" stroke="#B8860B" stroke-width="1" />
      <text x="235" y="354" font-family="'Inter', sans-serif" font-size="12" font-weight="600" fill="#ECC765" text-anchor="middle">+</text>
    </g>

    <!-- CENTER AEROSPACE DUAL-AXIS HINGE -->
    <g transform="translate(468, 120)" filter="url(#soft-shadow)">
      <!-- Hinge Spine Housing -->
      <rect x="0" y="0" width="64" height="380" rx="12" fill="#111113" stroke="url(#metal-accent-forest-green)" stroke-width="1.5" />
      
      <!-- Cylindrical Knurled Knuckles -->
      <rect x="8" y="25" width="48" height="60" rx="8" fill="url(#metal-accent-forest-green)" />
      <rect x="8" y="105" width="48" height="60" rx="8" fill="url(#metal-accent-forest-green)" />
      <rect x="8" y="215" width="48" height="60" rx="8" fill="url(#metal-accent-forest-green)" />
      <rect x="8" y="295" width="48" height="60" rx="8" fill="url(#metal-accent-forest-green)" />

      <!-- Knurl Lines on Hinge -->
      <line x1="8" y1="45" x2="56" y2="45" stroke="#111" stroke-width="1.5" />
      <line x1="8" y1="65" x2="56" y2="65" stroke="#111" stroke-width="1.5" />
      <line x1="8" y1="125" x2="56" y2="125" stroke="#111" stroke-width="1.5" />
      <line x1="8" y1="145" x2="56" y2="145" stroke="#111" stroke-width="1.5" />
      <line x1="8" y1="235" x2="56" y2="235" stroke="#111" stroke-width="1.5" />
      <line x1="8" y1="255" x2="56" y2="255" stroke="#111" stroke-width="1.5" />
      <line x1="8" y1="315" x2="56" y2="315" stroke="#111" stroke-width="1.5" />
      <line x1="8" y1="335" x2="56" y2="335" stroke="#111" stroke-width="1.5" />

      <!-- Center Status LED (Pulsing Cyan/Green Glow) -->
      <circle cx="32" cy="190" r="4.5" fill="#50E3C2" />
      <circle cx="32" cy="190" r="9" fill="#50E3C2" fill-opacity="0.35" />
    </g>

  </g>
</svg>