<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 450 550" width="100%" height="100%">
  <defs>
    <filter id="shadow-left" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="10" dy="20" stdDeviation="20" flood-color="#000000" flood-opacity="0.85" />
    </filter>
    <linearGradient id="metal-p-left" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E2A499" />
      <stop offset="50%" stop-color="#B76E79" />
      <stop offset="100%" stop-color="#E2A499" />
    </linearGradient>
    <linearGradient id="chassis-p-left" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#26262C" />
      <stop offset="40%" stop-color="#18181C" />
      <stop offset="100%" stop-color="#101012" />
    </linearGradient>
    <radialGradient id="cone-p-left" cx="45%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#2a2a2e" />
      <stop offset="40%" stop-color="#141416" />
      <stop offset="70%" stop-color="#0a0a0c" />
      <stop offset="90%" stop-color="#B76E79" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#050505" />
    </radialGradient>
    <pattern id="mesh-p-left" width="10" height="10" patternUnits="userSpaceOnUse">
      <circle cx="5" cy="5" r="1.5" fill="#B76E79" fill-opacity="0.3" />
    </pattern>
  </defs>

  <g filter="url(#shadow-left)" transform="translate(40, 30)">
    <rect x="0" y="0" width="370" height="480" rx="32" fill="url(#metal-p-left)" />
    <rect x="5" y="5" width="360" height="470" rx="28" fill="url(#chassis-p-left)" />
    <line x1="32" y1="5" x2="338" y2="5" stroke="#ffffff" stroke-width="1.8" stroke-opacity="0.45" />

    <circle cx="185" cy="230" r="135" fill="#0c0c0e" stroke="url(#metal-p-left)" stroke-width="3" />
    <circle cx="185" cy="230" r="132" fill="url(#mesh-p-left)" />
    <circle cx="185" cy="230" r="100" fill="url(#cone-p-left)" stroke="#1a1a1a" stroke-width="1" />
    <circle cx="185" cy="230" r="112" fill="none" stroke="#B76E79" stroke-width="1.2" stroke-opacity="0.4" />
    <circle cx="185" cy="230" r="88" fill="none" stroke="#222" stroke-width="2" />
    <circle cx="185" cy="230" r="70" fill="none" stroke="#161616" stroke-width="1.5" />
    <circle cx="185" cy="230" r="38" fill="url(#metal-p-left)" stroke="#E2A499" stroke-width="1" />
    <ellipse cx="175" cy="220" rx="14" ry="8" fill="#ffffff" fill-opacity="0.5" />

    
    <rect x="350" y="70" width="25" height="60" rx="6" fill="url(#metal-p-left)" stroke="#000" stroke-width="1" />
    <rect x="350" y="160" width="25" height="60" rx="6" fill="url(#metal-p-left)" stroke="#000" stroke-width="1" />
    <rect x="350" y="270" width="25" height="60" rx="6" fill="url(#metal-p-left)" stroke="#000" stroke-width="1" />
    <rect x="350" y="360" width="25" height="60" rx="6" fill="url(#metal-p-left)" stroke="#000" stroke-width="1" />
    <text x="185" y="415" font-family="'Inter', sans-serif" font-size="12" font-weight="700" letter-spacing="4" fill="#E2A499" text-anchor="middle">PANEL ALPHA ? LEFT</text>

  </g>
</svg>